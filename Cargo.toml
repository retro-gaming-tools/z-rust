[package]
name = "z-rust"
version = "0.51.0-beta"
edition = "2021"

[dependencies]
recomp-runtime = { path = "runtime" }
z-code-winz = { path = "programs/winz" }
z-code-zed = { path = "programs/zed" }

[profile.release]
opt-level = 2
codegen-units = 256
debug = false
panic = "unwind"

[profile.release.package.recomp-runtime]
opt-level = 3
